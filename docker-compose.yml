services:
  postgres:
    image: postgres:17
    container_name: decision-planner-postgres
    environment:
      POSTGRES_DB: decision_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  eventstoredb:
    image: docker.kurrent.io/kurrent-latest/kurrentdb:latest
    container_name: decision-planner-eventstoredb
    environment:
      KURRENTDB_CLUSTER_SIZE: 1
      KURRENTDB_INSECURE: "true"
      KURRENTDB_RUN_PROJECTIONS: All
      KURRENTDB_START_STANDARD_PROJECTIONS: "true"
      KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP: "true"
    ports:
      - "2113:2113"
    volumes:
      - eventstore_data:/var/lib/kurrentdb

  minutes-worker:
    build:
      context: ./services/minutes
    container_name: decision-planner-minutes-worker
    profiles: ["minutes"]
    restart: unless-stopped
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      KURRENT_CONNECTION_STRING: kurrentdb://eventstoredb:2113?tls=false
      MINUTES_SUBSCRIPTION_GROUP: ${MINUTES_SUBSCRIPTION_GROUP:-minutes-draft-generation-v1}
      DECISION_PLANNER_API_URL: http://host.docker.internal:5189
      MINUTES_SERVICE_API_KEY: ${MINUTES_SERVICE_API_KEY:-}
    depends_on:
      - eventstoredb

volumes:
  postgres_data:
  eventstore_data:
