services:
  postgres:
    image: postgres:17
    container_name: decision-planner-postgres
    environment:
      POSTGRES_DB: decision_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  eventstoredb:
    image: docker.kurrent.io/kurrent-latest/kurrentdb:latest
    container_name: decision-planner-eventstoredb
    environment:
      KURRENTDB_CLUSTER_SIZE: 1
      KURRENTDB_INSECURE: "true"
      KURRENTDB_RUN_PROJECTIONS: All
      KURRENTDB_START_STANDARD_PROJECTIONS: "true"
      KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP: "true"
    ports:
      - "2113:2113"
    volumes:
      - eventstore_data:/var/lib/kurrentdb

volumes:
  postgres_data:
  eventstore_data:
