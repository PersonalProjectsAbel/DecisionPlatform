[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionplanner-minutes"
version = "0.1.0"
description = "AI-assisted minutes service for DecisionPlanner"
requires-python = ">=3.11"
dependencies = [
    "dependency-injector>=4.41,<5",
    "fastapi>=0.115,<1",
    "google-genai>=1.0,<2",
    "httpx>=0.27,<1",
    "kurrentdbclient~=1.3",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.34,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
